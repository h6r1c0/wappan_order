name: Wappan app
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: wappan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 6
      - run: npx playwright test --browser chromium tests/browser/workflow.spec.js -g '11/7レビュー'
      - run: npx playwright test --browser webkit tests/browser/workflow.spec.js -g '11/7レビュー'
      - run: npx playwright test tests/browser/workflow.spec.js -g '11/4レビュー'
      - run: npx playwright test --browser webkit tests/browser/workflow.spec.js -g '11/4レビュー'
      - run: npx playwright test --browser chromium tests/browser/workflow.spec.js -g '11/5レビュー'
      - run: npx playwright test --browser webkit tests/browser/workflow.spec.js -g '11/5レビュー'
      - run: npx playwright test --browser chromium tests/browser/workflow.spec.js -g '11/6レビュー'
      - run: npx playwright test --browser webkit tests/browser/workflow.spec.js -g '11/6レビュー'
      - run: npx playwright test --browser chromium tests/browser/workflow.spec.js -g '11/8レビュー'
      - run: npx playwright test --browser webkit tests/browser/workflow.spec.js -g '11/8レビュー'
      - run: npx playwright test --browser chromium tests/browser/workflow.spec.js -g '11/9レビュー'
      - run: npx playwright test --browser webkit tests/browser/workflow.spec.js -g '11/9レビュー'
      - run: npx playwright test --browser chromium tests/browser/workflow.spec.js -g '11/10レビュー'
      - run: npx playwright test --browser webkit tests/browser/workflow.spec.js -g '11/10レビュー'
      - run: npx playwright test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-review
          path: |
            test-results/*.png
            test-results/allocation-*-metrics.json
            test-results/*-a4.pdf
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
